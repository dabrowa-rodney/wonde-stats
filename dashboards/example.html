<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Example dashboard</title>
    <meta
      name="description"
      content="Placeholder showing how an uploaded HTML dashboard is served. Safe to delete."
    />
    <style>
      body {
        margin: 0;
        padding: 48px 24px;
        font-family: Gilroy, ui-sans-serif, system-ui, -apple-system, 'Segoe UI',
          Roboto, Helvetica, Arial, sans-serif;
        color: #14161a;
        background: #ffffff;
      }
      .wrap {
        max-width: 640px;
        margin: 0 auto;
      }
      h1 {
        font-size: 24px;
        letter-spacing: -0.02em;
        margin: 0 0 12px;
      }
      p {
        color: #5c6370;
        line-height: 1.6;
        margin: 0 0 16px;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        background: #f5f6f8;
        border: 1px solid #e2e5ea;
        border-radius: 6px;
        padding: 2px 6px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #eef1f6;
          background: #14181f;
        }
        p {
          color: #a3abb9;
        }
        code {
          background: #0d1017;
          border-color: #262c36;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Example dashboard</h1>
      <p>
        This placeholder confirms the hosting works end to end. It is a plain
        HTML file at <code>dashboards/example.html</code>, served at
        <code>/dashboard/example</code> only to signed-in visitors.
      </p>
      <p>
        Replace it with a real dashboard, or delete the file — the home page
        updates itself either way.
      </p>
    </div>
  </body>
</html>
